[package]
name = "goldcoin-mempool"
version = "0.17.0"
edition = "2021"
authors = ["The Goldcoin Core developers"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Data structures
dashmap = "6.1"
priority-queue = "2.1"
indexmap = "2.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Logging
tracing = "0.1"

# Error handling
thiserror = "1.0"

# Crypto
sha2 = "0.10"

# Time
chrono = "0.4"

# Metrics
prometheus = "0.13"

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"