[package]
name = "goldcoin-ffi"
version = "0.17.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
goldcoin-network = { path = "../goldcoin-network" }
goldcoin-consensus = { path = "../goldcoin-consensus" }

# Async runtime
tokio = { version = "1.40", features = ["rt", "sync"] }

# FFI
cxx = "1.0"
libc = "0.2"

# Safety
static_assertions = "1.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[build-dependencies]
cxx-build = "1.0"
cc = "1.1"