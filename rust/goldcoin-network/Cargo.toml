[package]
name = "goldcoin-network"
version = "0.17.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytes = "1.7"
byteorder = "1.5"

# Cryptography
sha2 = "0.10"
blake3 = "1.5"
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
chacha20poly1305 = "0.10"

# Networking
quinn = "0.11"  # QUIC transport for modern networking
rustls = "0.23"
rcgen = "0.13"

# Data structures
dashmap = "6.0"  # Concurrent hashmap
parking_lot = "0.12"  # Better mutex
crossbeam = "0.8"
arc-swap = "1.7"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Metrics
prometheus = "0.13"