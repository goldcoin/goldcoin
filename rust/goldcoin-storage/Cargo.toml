[package]
name = "goldcoin-storage"
version = "0.17.0"
edition = "2021"
authors = ["The Goldcoin Core developers"]
license = "MIT"

[dependencies]
# Database
rocksdb = { version = "0.22", features = ["multi-threaded-cf"] }
sled = "0.34"

# Async
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytes = "1.7"

# Crypto
sha2 = "0.10"

# Compression
zstd = "0.13"
lz4 = "1.28"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

[dev-dependencies]
tempfile = "3.13"
criterion = "0.5"