[package]
name = "goldcoin-tx"
version = "0.17.0"
edition = "2021"
authors = ["Goldcoin Core developers"]
license = "MIT"
description = "Goldcoin Transaction Tool - Pure Rust Implementation"

[[bin]]
name = "goldcoin-tx"
path = "src/main.rs"

[dependencies]
# Core goldcoin crates
goldcoin-script = { path = "../goldcoin-script" }
goldcoin-consensus = { path = "../goldcoin-consensus" }

# CLI framework
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
secp256k1 = { version = "0.29", features = ["global-context", "recovery"] }
sha2 = "0.10"
ripemd = "0.1"

# Data handling
bytes = { workspace = true }
hex = "0.4"
base64 = "0.22"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = "3.12"