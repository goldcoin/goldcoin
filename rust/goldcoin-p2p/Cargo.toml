[package]
name = "goldcoin-p2p"
version = "0.17.0"
edition = "2021"
authors = ["The Goldcoin Core developers"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytes = "1.7"

# Networking
quinn = "0.11"
rustls = "0.23"

# Data structures
dashmap = "6.1"
arc-swap = "1.7"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Crypto
sha2 = "0.10"
ed25519-dalek = "2.1"
rand = "0.8"

# Time
chrono = "0.4"

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"