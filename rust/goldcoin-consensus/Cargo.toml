[package]
name = "goldcoin-consensus"
version = "0.17.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1.40", features = ["sync", "rt"] }
async-trait = "0.1"

# Data structures
bytes = "1.7"
byteorder = "1.5"
bitvec = "1.0"
indexmap = "2.2"
smallvec = "1.13"

# Cryptography
sha2 = "0.10"
blake3 = "1.5"
ripemd = "0.1"
secp256k1 = { version = "0.29", features = ["recovery", "global-context"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Big numbers
num-bigint = "0.4"
num-traits = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Parallelism
rayon = "1.10"
crossbeam = "0.8"

# Memory management
bumpalo = "3.16"  # Arena allocation for validation
memmap2 = "0.9"

# Logging
tracing = "0.1"