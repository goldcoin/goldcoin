[package]
name = "goldcoin-cli"
version = "0.17.0"
edition = "2021"
authors = ["Goldcoin Core developers"]
license = "MIT"
description = "Goldcoin Core CLI - Pure Rust Implementation"

[[bin]]
name = "goldcoin-cli"
path = "src/main.rs"

[dependencies]
# RPC client functionality
goldcoin-rpc = { path = "../goldcoin-rpc" }

# HTTP/JSON-RPC client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
jsonrpsee = { version = "0.24", features = ["client", "macros"] }

# CLI framework
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { workspace = true, features = ["rt", "macros"] }

# Terminal output
colored = "2.1"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Authentication
base64 = "0.22"

# Utilities
hex = "0.4"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.12"