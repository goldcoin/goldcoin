[package]
name = "goldcoin-utxo"
version = "0.17.0"
edition = "2021"
authors = ["The Goldcoin Core developers"]
license = "MIT"

[dependencies]
# Database
rocksdb = { version = "0.22", features = ["multi-threaded-cf"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Data structures
dashmap = "6.1"
arc-swap = "1.7"
bitvec = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytes = "1.7"

# Crypto
sha2 = "0.10"
blake3 = "1.5"

# Logging
tracing = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Metrics
prometheus = "0.13"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.13"
proptest = "1.5"