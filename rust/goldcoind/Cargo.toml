[package]
name = "goldcoind"
version = "0.17.0"
edition = "2021"
authors = ["Goldcoin Core developers"]
license = "MIT"
description = "Goldcoin Core Daemon - Pure Rust Implementation"

[[bin]]
name = "goldcoind"
path = "src/main.rs"

[dependencies]
# Workspace crates
goldcoin-consensus = { path = "../goldcoin-consensus" }
goldcoin-network = { path = "../goldcoin-network" }
goldcoin-script = { path = "../goldcoin-script" }
goldcoin-rpc = { path = "../goldcoin-rpc" }
goldcoin-storage = { path = "../goldcoin-storage" }
goldcoin-mempool = { path = "../goldcoin-mempool" }
goldcoin-utxo = { path = "../goldcoin-utxo" }

# Core async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = "0.3"

# CLI and config
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Network and crypto
bytes = { workspace = true }
hex = "0.4"
base64 = "0.22"

# System integration
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
ctrlc = "3.4"
dirs = "5.0"

# Performance monitoring
prometheus = "0.13"

[dev-dependencies]
tempfile = "3.12"