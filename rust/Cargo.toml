[workspace]
members = [
    "goldcoin-network",
    "goldcoin-consensus",
    "goldcoin-ffi",
    "goldcoin-p2p",
    "goldcoin-mempool",
    "goldcoin-utxo",
    "goldcoin-script",
    "goldcoin-rpc",
    "goldcoin-storage",
]
resolver = "2"

[workspace.package]
version = "0.17.0"
edition = "2021"
authors = ["Goldcoin Core developers"]
license = "MIT"

[workspace.dependencies]

# Core dependencies
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
bytes = "1.7"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true