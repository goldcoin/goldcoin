# Goldcoin Pre-commit Configuration
# Part of Operation Phoenix++ 🔥
# Auto-quality enforcement by LCC & SCC

repos:
  # C++ formatting and linting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: ['-i']
        files: \.(cpp|cc|cxx|hpp|h|c)$
        exclude: |
          (?x)^(
            src/leveldb/.*|
            src/secp256k1/.*|
            src/univalue/.*|
            src/qt/paymentrequest\.pb\.(cc|h)
          )$

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: \.(lock|png|jpg|jpeg|gif|ico|pdf)$

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-xml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: \.(png|jpg|jpeg|gif|ico|pdf)$
      - id: trailing-whitespace
        exclude: \.(png|jpg|jpeg|gif|ico|pdf|patch)$
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix']
        exclude: |
          (?x)^(
            depends/.*|
            src/leveldb/.*|
            src/secp256k1/.*
          )$

  # Shell script analysis
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        exclude: |
          (?x)^(
            depends/.*|
            src/leveldb/.*|
            src/secp256k1/.*
          )$

  # CMake formatting
  - repo: https://github.com/cmake-lint/cmake-lint
    rev: 1.4.2
    hooks:
      - id: cmake-format
        args: ['-i']
      - id: cmake-lint

  # Python formatting (for any Python scripts)
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3

  # Copyright header check
  - repo: local
    hooks:
      - id: check-copyright
        name: Check copyright headers
        entry: python3 scripts/check_copyright.py
        language: system
        types: [c++, c]
        exclude: |
          (?x)^(
            src/leveldb/.*|
            src/secp256k1/.*|
            src/univalue/.*|
            src/crypto/ctaes/.*
          )$
        pass_filenames: true

  # Custom Goldcoin checks
  - repo: local
    hooks:
      - id: no-boost-foreach
        name: Check for BOOST_FOREACH usage
        entry: sh -c 'grep -n "BOOST_FOREACH" "$@" && exit 1 || exit 0'
        language: system
        types: [c++]
        exclude: src/.clang-format

      - id: modern-cpp-check
        name: Enforce modern C++ patterns
        entry: sh -c 'grep -n "\<NULL\>" "$@" && echo "Use nullptr instead of NULL" && exit 1 || exit 0'
        language: system
        types: [c++]

      - id: smart-pointer-check
        name: Check for raw new/delete
        entry: sh -c 'grep -E "^\s*(new |delete )" "$@" && echo "Consider using smart pointers" && exit 1 || exit 0'
        language: system
        types: [c++]
        exclude: |
          (?x)^(
            src/support/lockedpool\.cpp|
            src/support/allocators/.*|
            src/test/.*
          )$

# Configuration
default_stages: [commit, push]
fail_fast: false
verbose: true