name: CI

on:
  push:
    branches: [ goldcoin-master, development, modernize-python-312 ]
  pull_request:
    branches: [ goldcoin-master, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_SIZE: 100M
  CCACHE_TEMPDIR: /tmp/.ccache-temp
  CCACHE_COMPRESS: 1
  PYTHON_DEBUG: 1
  SDK_URL: https://bitcoincore.org/depends-sources/sdks
  WINEDEBUG: fixme-all

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # Define retry function for apt commands to handle lock contention
          retry_apt() {
            for i in {1..10}; do
              sudo apt-get "$@" && break
              echo "apt-get $* failed, retrying in 10 seconds..."
              sleep 10
            done
          }
          
          retry_apt update
          retry_apt install -y python3-pip shellcheck

      - name: Run lint checks
        run: |
          if [ -f contrib/devtools/check-doc.py ]; then
            python3 contrib/devtools/check-doc.py
          fi

  build:
    needs: lint
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MINIMAL TEST: Only Linux x86_64 for now
          - name: "Linux x86_64"
            host: x86_64-unknown-linux-gnu
            packages: "bc python3-setuptools python3-wheel"
            dep_opts: "NO_QT=1 NO_UPNP=1 DEBUG=1"
            bitcoin_config: "--enable-zmq --enable-glibc-back-compat --enable-reduce-exports --disable-wallet CPPFLAGS=-DDEBUG_LOCKORDER"
            run_tests: true
            goldcoin_scrypt: 1
            goal: "install"

          - name: "Windows x86_64"
            host: x86_64-w64-mingw32
            packages: "nsis g++-mingw-w64-x86-64-posix wine-binfmt wine64"
            dep_opts: "DEBUG=1"
            bitcoin_config: "--enable-reduce-exports --with-incompatible-bdb CPPFLAGS=-DDEBUG_LOCKORDER"
            run_tests: false
            goldcoin_scrypt: 0
            goal: "install"

          - name: "Linux ARM64"
            host: aarch64-linux-gnu
            packages: "bc python3-setuptools python3-wheel gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
            dep_opts: "NO_QT=1 NO_UPNP=1 DEBUG=1"
            bitcoin_config: "--enable-zmq --enable-glibc-back-compat --enable-reduce-exports --enable-wallet --with-incompatible-bdb CPPFLAGS=-DDEBUG_LOCKORDER"
            run_tests: false
            goldcoin_scrypt: 1
            goal: "install"
            cross_compile: true

          - name: "macOS Intel"
            os: macos-13
            host: x86_64-apple-darwin
            packages: ""
            dep_opts: "NO_UPNP=1 DEBUG=1 FALLBACK_DOWNLOAD_PATH=https://bitcoincore.org/depends-sources"
            bitcoin_config: "--enable-reduce-exports --enable-wallet --with-incompatible-bdb --with-gui=qt5 CPPFLAGS=-DDEBUG_LOCKORDER"
            run_tests: false
            goldcoin_scrypt: 1
            goal: "install"
            brew_packages: "automake libtool boost berkeley-db@4 pkg-config python@3.12 qt@5 miniupnpc libnatpmp zeromq openssl@3 qrencode protobuf"

          - name: "macOS Apple Silicon"
            os: macos-latest
            host: arm64-apple-darwin
            packages: ""
            dep_opts: "NO_UPNP=1 DEBUG=1 FALLBACK_DOWNLOAD_PATH=https://bitcoincore.org/depends-sources"
            bitcoin_config: "--enable-reduce-exports --enable-wallet --with-incompatible-bdb --with-gui=qt5 CPPFLAGS=-DDEBUG_LOCKORDER"
            run_tests: false
            goldcoin_scrypt: 1
            goal: "install"
            brew_packages: "automake libtool boost berkeley-db@4 pkg-config python@3.12 qt@5 miniupnpc libnatpmp zeromq openssl@3 qrencode protobuf"

          # ALL OTHER BUILDS TEMPORARILY DISABLED FOR TESTING
          # - name: "Linux x86_64 (no wallet)"
          #   host: x86_64-unknown-linux-gnu
          #   packages: "python3 python3-setuptools python3-wheel"
          #   dep_opts: "NO_WALLET=1"
          #   bitcoin_config: "--enable-glibc-back-compat --enable-reduce-exports"
          #   run_tests: true
          #   goldcoin_scrypt: 1
          #   goal: "install"

    name: ${{ matrix.name }}
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.host }}
          max-size: ${{ env.CCACHE_SIZE }}

      - name: Set up build environment
        run: |
          # Handle macOS with Homebrew
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # Ensure Xcode Command Line Tools are properly configured
            echo "Setting up Xcode Command Line Tools..."
            sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
            echo "Xcode Developer Path: $(xcode-select -p)"
            
            # Verify standard headers are available
            echo "Checking for available SDKs:"
            ls -la /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/ || echo "SDK directory not found"
            
            # Check for stdlib.h availability
            echo "Verifying stdlib.h availability:"
            find /Applications/Xcode.app/Contents/Developer -name "stdlib.h" 2>/dev/null | head -5 || echo "stdlib.h not found in Xcode"
            
            # Set SDK environment variables
            export SDKROOT=$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
            export MACOSX_DEPLOYMENT_TARGET=10.15
            echo "SDKROOT=${SDKROOT}" >> $GITHUB_ENV
            echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET}" >> $GITHUB_ENV
            
            # Install Homebrew packages
            if [ -n "${{ matrix.brew_packages }}" ]; then
              brew install ${{ matrix.brew_packages }}
            fi
            
            # Verify Boost installation
            brew list boost && echo "Boost installed at: $(brew --prefix boost)"
            
            # Set up persistent environment variables
            echo "BOOST_ROOT=$(brew --prefix boost)" >> $GITHUB_ENV
            echo "Qt5_DIR=$(brew --prefix qt@5)" >> $GITHUB_ENV
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
            echo "BDB_PREFIX=$(brew --prefix berkeley-db@4)" >> $GITHUB_ENV
            
            # Set up paths
            echo "PATH=$(brew --prefix qt@5)/bin:${PATH}" >> $GITHUB_ENV
            echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV
            echo "LDFLAGS=-L$(brew --prefix openssl@3)/lib -L$(brew --prefix berkeley-db@4)/lib -L$(brew --prefix boost)/lib" >> $GITHUB_ENV
            echo "CPPFLAGS=-I$(brew --prefix openssl@3)/include -I$(brew --prefix berkeley-db@4)/include -I$(brew --prefix boost)/include" >> $GITHUB_ENV
          else
            # Linux build environment setup
            # For container builds, we might not have sudo
            if command -v sudo >/dev/null 2>&1; then
              SUDO=sudo
            else
              SUDO=""
            fi
            
            # Define retry function for apt commands to handle lock contention
            retry_apt() {
              for i in {1..10}; do
                $SUDO apt-get "$@" && break
                echo "apt-get $* failed, retrying in 10 seconds..."
                sleep 10
              done
            }
            
            # Update package lists
            retry_apt update
            
            # Skip base install for container builds that have packages pre-installed
            if [ "${{ matrix.skip_base_install }}" != "true" ]; then
              # Install base dependencies including Boost and Python dev headers
              retry_apt install --no-install-recommends --no-upgrade -qq build-essential libtool autotools-dev automake pkg-config libssl-dev libevent-dev bsdmainutils libboost-all-dev python3-dev
            fi
            
            if [ -n "${{ matrix.dpkg_add_arch }}" ]; then
              $SUDO dpkg --add-architecture "${{ matrix.dpkg_add_arch }}"
              retry_apt update
            fi
            if [ -n "${{ matrix.packages }}" ]; then
              retry_apt install --no-install-recommends --no-upgrade -qq ${{ matrix.packages }}
            fi
          fi

      - name: Install Python dependencies
        if: matrix.goldcoin_scrypt == 1
        run: |
          # Upgrade setuptools first (following Dogecoin pattern)
          python3 -m pip install setuptools==70.3.0 --upgrade
          # Install required Python packages for tests
          python3 -m pip install pyzmq
          # Install pybind11 for building native extensions
          python3 -m pip install pybind11
          # Install legacy asyncore for Python 3.12 compatibility (removed from stdlib)
          python3 -m pip install pyasynchat
          # Skip goldcoin_scrypt for Python 3.12 - it's not compatible with PY_SSIZE_T_CLEAN requirement
          # Our native implementation in python-bindings/ will be used instead
          echo "INFO: Using native goldcoin_crypto implementation for Python 3.12 compatibility"

      - name: Build native crypto extensions
        if: matrix.goldcoin_scrypt == 1
        run: |
          # Build our native goldcoin_crypto extension
          cd python-bindings
          python3 setup.py build_ext --inplace || echo "WARNING: Native extension build failed, using fallback"

      - name: Prepare build
        run: |
          mkdir -p depends/SDKs depends/sdk-sources
          # Set up ccache
          export PATH="/usr/lib/ccache:$PATH"
          ccache --max-size=${{ env.CCACHE_SIZE }}

      - name: Update config scripts for modern platforms
        if: runner.os == 'macOS'
        run: |
          cd depends
          echo "Current config.sub version:"
          ./config.sub --version 2>/dev/null || echo "No version info"
          
          # Download latest if needed
          wget -q -O config.sub.new https://git.savannah.gnu.org/cgit/config.git/plain/config.sub
          wget -q -O config.guess.new https://git.savannah.gnu.org/cgit/config.git/plain/config.guess
          
          # Only update if different
          if ! cmp -s config.sub config.sub.new; then
            echo "Updating config.sub..."
            mv config.sub.new config.sub
          else
            rm config.sub.new
          fi
          
          if ! cmp -s config.guess config.guess.new; then
            echo "Updating config.guess..."
            mv config.guess.new config.guess
          else
            rm config.guess.new
          fi
          
          chmod +x config.sub config.guess
          
          # Test that arm64-apple-darwin is now recognized
          echo "Testing config.sub with arm64-apple-darwin:"
          ./config.sub arm64-apple-darwin || echo "config.sub failed"
          cd ..

      - name: Build dependencies
        run: |
          # Set up macOS-specific paths
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export MAKEJOBS="-j$(sysctl -n hw.ncpu)"
            
            echo "=== Platform detection check ==="
            echo "Current directory: $(pwd)"
            echo "Host triplet: $(./depends/config.guess)"
            echo "HOST variable: ${{ matrix.host }}"
            
            # Create a custom packages.mk without boost and qt for macOS
            cd depends
            
            echo "=== Files in depends/hosts/ ==="
            ls -la hosts/
            
            echo "=== Testing config.guess from depends directory ==="
            echo "config.guess output: $(./config.guess)"
            
            cp packages/packages.mk packages/packages.mk.bak
            
            # Remove boost and openssl from main packages
            sed -i '' 's/packages:=boost openssl libevent zeromq/packages:=libevent zeromq/' packages/packages.mk
            
            # Remove qt packages
            sed -i '' 's/qt_packages = qrencode protobuf zlib/qt_packages =/' packages/packages.mk
            sed -i '' 's/qt_darwin_packages=qt/qt_darwin_packages=/' packages/packages.mk
            
            # Remove bdb from wallet_packages - use Homebrew's berkeley-db@4 instead
            sed -i '' 's/wallet_packages=bdb/wallet_packages=/' packages/packages.mk
            
            # Debug output
            echo "=== Modified packages.mk content ==="
            cat packages/packages.mk | head -n 15
            
            echo "=== Checking package modifications ==="
            grep "packages:=" packages/packages.mk
            grep "wallet_packages=" packages/packages.mk || echo "wallet_packages line not found"
            
            # Verify Homebrew installations
            echo "=== Homebrew package list ==="
            brew list | grep -E "boost|qt@5|openssl@3|berkeley-db" || true
            
            echo "=== Checking Homebrew Boost installation ==="
            echo "Boost prefix: $(brew --prefix boost)"
            ls -la $(brew --prefix boost)/lib/libboost* | head -n 5 || echo "Boost libs not found"
            
            echo "=== Checking Homebrew Qt5 installation ==="
            echo "Qt5 prefix: $(brew --prefix qt@5)"
            ls -la $(brew --prefix qt@5)/lib/cmake/Qt5*/ | head -n 5 || echo "Qt5 cmake files not found"
            
            echo "=== OpenSSL configuration ==="
            echo "OPENSSL_ROOT_DIR: ${OPENSSL_ROOT_DIR}"
            ls -la ${OPENSSL_ROOT_DIR}/include/openssl/sha.h || echo "OpenSSL headers not found!"
            ls -la ${OPENSSL_ROOT_DIR}/lib/libssl.* | head -3 || echo "OpenSSL libs not found!"
            
            echo "=== Berkeley DB from Homebrew ==="
            echo "BDB_PREFIX: ${BDB_PREFIX}"
            ls -la ${BDB_PREFIX}/include/db.h || echo "BDB headers not found"
            ls -la ${BDB_PREFIX}/lib/libdb*.dylib | head -3 || echo "BDB libs not found"
            
            echo "=== Environment variables check ==="
            echo "BOOST_ROOT: ${BOOST_ROOT}"
            echo "QT5_ROOT: ${QT5_ROOT}"
            echo "OPENSSL_ROOT_DIR: ${OPENSSL_ROOT_DIR}"
            echo "SDKROOT: ${SDKROOT}"
            echo "PATH: ${PATH}"
            echo "PKG_CONFIG_PATH: ${PKG_CONFIG_PATH}"
            
            cd ..
            
            echo "=== Host detection for make ==="
            HOST_TRIPLET=${{ matrix.host }}
            host_arch=$(echo $HOST_TRIPLET | cut -d- -f1)
            host_vendor=$(echo $HOST_TRIPLET | cut -d- -f2) 
            host_os=$(echo $HOST_TRIPLET | cut -d- -f3)
            
            echo "Matrix HOST: ${{ matrix.host }}"
            echo "Parsed components:"
            echo "  arch: $host_arch"
            echo "  vendor: $host_vendor"
            echo "  os: $host_os"
            
            # Alternative approach - let config.guess do its job from depends directory
            cd depends
            
            echo "=== Verifying config scripts ==="
            echo "Current directory: $(pwd)"
            echo "Directory contents:"
            ls -la | head -20
            
            echo "=== Testing config scripts ==="
            ls -la config.guess config.sub
            
            # Test config.guess directly
            echo "Testing config.guess: $(./config.guess)"
            
            # Test config.sub with the HOST value
            echo "Testing config.sub with ${{ matrix.host }}: $(./config.sub ${{ matrix.host }})"
            
            # Ensure they're executable (redundant but safe)
            chmod +x config.guess config.sub
            
            # For macOS, we know the canonical format, so pass it explicitly
            echo "=== Running make with explicit canonical_host for macOS ==="
            # No need for BDB mutex configuration - using Homebrew's berkeley-db@4
            make $MAKEJOBS HOST=${{ matrix.host }} canonical_host=${{ matrix.host }} ${{ matrix.dep_opts }}
            cd ..
          else
            export MAKEJOBS="-j$(nproc)"
            make $MAKEJOBS -C depends HOST=${{ matrix.host }} ${{ matrix.dep_opts }}
          fi

      - name: Configure and build
        run: |
          # Set up build environment
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export MAKEJOBS="-j$(sysctl -n hw.ncpu)"
            
            echo "=== Configure environment variables ==="
            echo "BOOST_ROOT from env: ${BOOST_ROOT}"
            echo "QT5_ROOT from env: ${QT5_ROOT}"
            echo "SDKROOT from env: ${SDKROOT}"
            
            # Use BOOST_ROOT from environment
            export BOOST_ROOT="${BOOST_ROOT}"
            # Update bitcoin_config to use proper boost path
            export BITCOIN_CONFIG_BOOST="--with-boost=${BOOST_ROOT}"
            
            # Set Qt5 paths for configure
            export QT5_ROOT=$(brew --prefix qt@5)
            export CMAKE_PREFIX_PATH="${QT5_ROOT}:${CMAKE_PREFIX_PATH}"
            export PKG_CONFIG_PATH="${QT5_ROOT}/lib/pkgconfig:${PKG_CONFIG_PATH}"
            echo "QT5_ROOT=${QT5_ROOT}" >> $GITHUB_ENV
            echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}" >> $GITHUB_ENV
            
            # Set OpenSSL paths for configure
            export OPENSSL_CFLAGS="-I${OPENSSL_ROOT_DIR}/include"
            export OPENSSL_LIBS="-L${OPENSSL_ROOT_DIR}/lib -lssl -lcrypto"
            export BITCOIN_CONFIG_OPENSSL="--with-openssl=${OPENSSL_ROOT_DIR}"
            
            # Set BDB paths for configure
            export BDB_CFLAGS="-I${BDB_PREFIX}/include"
            export BDB_LIBS="-L${BDB_PREFIX}/lib -ldb_cxx-4.8"
            export BITCOIN_CONFIG_BDB="--with-incompatible-bdb BDB_CFLAGS=\"${BDB_CFLAGS}\" BDB_LIBS=\"${BDB_LIBS}\""
            
            echo "=== Final configure environment ==="
            echo "BITCOIN_CONFIG_BOOST: ${BITCOIN_CONFIG_BOOST}"
            echo "BITCOIN_CONFIG_OPENSSL: ${BITCOIN_CONFIG_OPENSSL}"
            echo "BITCOIN_CONFIG_BDB: ${BITCOIN_CONFIG_BDB}"
            echo "OPENSSL_CFLAGS: ${OPENSSL_CFLAGS}"
            echo "OPENSSL_LIBS: ${OPENSSL_LIBS}"
            echo "BDB_CFLAGS: ${BDB_CFLAGS}"
            echo "BDB_LIBS: ${BDB_LIBS}"
            echo "CMAKE_PREFIX_PATH: ${CMAKE_PREFIX_PATH}"
            echo "PKG_CONFIG_PATH: ${PKG_CONFIG_PATH}"
          else
            export MAKEJOBS="-j$(nproc)"
            export BITCOIN_CONFIG_BOOST=""
            export BITCOIN_CONFIG_OPENSSL=""
            export BITCOIN_CONFIG_BDB=""
          fi
          
          export BASE_OUTDIR=${{ github.workspace }}/out
          export OUTDIR=$BASE_OUTDIR/${{ matrix.host }}
          export BITCOIN_CONFIG_ALL="--disable-dependency-tracking --prefix=${{ github.workspace }}/depends/${{ matrix.host }} --bindir=$OUTDIR/bin --libdir=$OUTDIR/lib"
          
          # Threading support handled by autotools
          
          # Clean any previous compiler settings
          unset CC
          unset CXX
          
          # Set cross-compilation environment for ARM64
          if [ "${{ matrix.cross_compile }}" = "true" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
            export AR=aarch64-linux-gnu-ar
            export STRIP=aarch64-linux-gnu-strip
            export RANLIB=aarch64-linux-gnu-ranlib
            export NM=aarch64-linux-gnu-nm
          fi
          
          # Configure shell if needed
          if [ -n "${{ matrix.use_shell }}" ]; then
            export CONFIG_SHELL="${{ matrix.use_shell }}"
            ${{ matrix.use_shell }} -c "./autogen.sh"
          else
            ./autogen.sh
          fi
          
          # Build
          mkdir -p build && cd build
          
          # Set OpenSSL configuration for macOS
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export OPENSSL_CFLAGS="${OPENSSL_CFLAGS}"
            export OPENSSL_LIBS="${OPENSSL_LIBS}"
            export BDB_CFLAGS="${BDB_CFLAGS}"
            export BDB_LIBS="${BDB_LIBS}"
            BITCOIN_CONFIG_EXTRA="$BITCOIN_CONFIG_BOOST $BITCOIN_CONFIG_OPENSSL"
          else
            BITCOIN_CONFIG_EXTRA="$BITCOIN_CONFIG_BOOST"
          fi
          
          ../configure --cache-file=config.cache $BITCOIN_CONFIG_ALL $BITCOIN_CONFIG_EXTRA ${{ matrix.bitcoin_config }} || (cat config.log && false)
          make distdir VERSION=${{ matrix.host }}
          cd goldcoin-${{ matrix.host }}
          ./configure --cache-file=../config.cache $BITCOIN_CONFIG_ALL $BITCOIN_CONFIG_EXTRA ${{ matrix.bitcoin_config }} || (cat config.log && false)
          make $MAKEJOBS ${{ matrix.goal }} || (echo "Build failure. Verbose build follows." && make ${{ matrix.goal }} V=1 && false)

      - name: Run tests
        if: matrix.run_tests
        run: |
          cd build/goldcoin-${{ matrix.host }}
          export MAKEJOBS="-j$(nproc)"
          export LD_LIBRARY_PATH=${{ github.workspace }}/depends/${{ matrix.host }}/lib
          
          # Run unit tests
          make $MAKEJOBS check VERBOSE=1
          
          # Run functional tests (if available)
          if [ -f ../../qa/pull-tester/rpc-tests.py ]; then
            python3 ../../qa/pull-tester/rpc-tests.py --coverage
          elif [ -f ../../test/functional/test_runner.py ]; then
            python3 ../../test/functional/test_runner.py
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldcoin-${{ matrix.host }}
          path: |
            out/
            build/goldcoin-${{ matrix.host }}/src/goldcoin*
            build/goldcoin-${{ matrix.host }}/src/qt/goldcoin-qt*
          retention-days: 7