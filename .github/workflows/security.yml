name: Security

on:
  push:
    branches: [ goldcoin-master, development ]
  pull_request:
    branches: [ goldcoin-master, development ]
  schedule:
    # Run security scan daily at 02:00 UTC
    - cron: '0 2 * * *'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'python' ]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Install dependencies (C++)
        if: matrix.language == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config libssl-dev libevent-dev bsdmainutils libboost-all-dev

      - name: Build for CodeQL (C++)
        if: matrix.language == 'cpp'
        run: |
          ./autogen.sh
          ./configure --disable-wallet --disable-tests --disable-gui
          make -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'goldcoin'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
            --failOnCVSS 7
            --exclude "**/test/**"
            --exclude "**/tests/**"

      - name: Upload dependency check results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30
      
      - name: Fix permissions for cleanup
        if: always()
        run: |
          # Ensure the runner can clean up the reports directory
          if [ -d "reports/" ]; then
            sudo chown -R $USER:$USER reports/ || true
            chmod -R u+rwx reports/ || true
          fi

  secrets-scan:
    name: Secrets Scan
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-secrets.sarif'
          scanners: 'secret'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-secrets.sarif'

  security-audit:
    name: Security Audit
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy
          pip3 install bandit safety

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem src/ || true

      - name: Run clang-tidy (if available)
        run: |
          if command -v clang-tidy >/dev/null 2>&1; then
            find src/ -name "*.cpp" -o -name "*.h" | head -10 | xargs clang-tidy || true
          fi

      - name: Run bandit (Python security)
        run: |
          find . -name "*.py" -path "./qa/*" -o -path "./contrib/*" | head -20 | xargs bandit -r || true

      - name: Check for hardcoded secrets patterns
        run: |
          # Check for potential security issues
          echo "Checking for potential security issues..."
          
          # Look for hardcoded private keys
          if grep -r "BEGIN.*PRIVATE KEY" --include="*.cpp" --include="*.h" --include="*.py" .; then
            echo "WARNING: Found potential private keys in code"
            exit 1
          fi
          
          # Look for hardcoded passwords/secrets
          if grep -ri "password.*=" --include="*.cpp" --include="*.h" --include="*.py" . | grep -v test; then
            echo "WARNING: Found potential hardcoded passwords"
          fi
          
          # Look for TODO/FIXME security notes
          if grep -ri "TODO.*security\|FIXME.*security" --include="*.cpp" --include="*.h" .; then
            echo "INFO: Found security-related TODO/FIXME items"
          fi

  build-security:
    name: Build Security Check
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build security
        run: |
          # Check for secure build flags
          if [ -f configure.ac ]; then
            echo "Checking build configuration security..."
            
            # Check for stack protection
            if ! grep -q "stack-protector" configure.ac; then
              echo "WARNING: Stack protection not explicitly configured"
            fi
            
            # Check for fortify source
            if ! grep -q "FORTIFY_SOURCE" configure.ac; then
              echo "WARNING: FORTIFY_SOURCE not explicitly configured"
            fi
          fi
          
          # Check for security-related compiler flags in makefiles
          find . -name "Makefile*" -o -name "*.mk" | xargs grep -l "fstack-protector\|FORTIFY_SOURCE\|Wformat-security" || echo "No security flags found in makefiles"